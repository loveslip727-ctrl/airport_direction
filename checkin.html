<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 체크인</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", sans-serif;
    margin: 0; padding: 16px;
    background: #f4f6f9;
    text-align: center;
  }
  h1 { font-size: 22px; color: #1B3A6B; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 16px; }
  #reader {
    width: 100%; max-width: 420px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #1B3A6B;
  }
  .result {
    max-width: 420px; margin: 20px auto;
    padding: 24px; border-radius: 12px;
    font-size: 20px; font-weight: bold;
    display: none;
  }
  .result.ok { background: #E8F5E9; color: #2E7D32; border: 2px solid #2E7D32; }
  .result.warn { background: #FBEAEA; color: #C0392B; border: 2px solid #C0392B; }
  .result .big { font-size: 28px; display: block; margin-bottom: 8px; }
  .zone-select {
    margin: 12px auto; max-width: 420px;
  }
  .zone-select select {
    font-size: 16px; padding: 8px 12px; border-radius: 8px;
  }
  .retry-btn {
    margin-top: 16px; padding: 12px 24px; font-size: 16px;
    border-radius: 8px; border: none; background: #1B3A6B; color: white;
  }
</style>
</head>
<body>
  <h1>출퇴근 QR 체크인</h1>
  <div class="sub">배지의 QR코드를 카메라에 비춰주세요</div>

  <div class="zone-select">
    구역:
    <select id="zoneFilter">
      <option value="all">전체</option>
      <option value="금호어울림 2차 경로당">금호어울림 2차 경로당</option>
      <option value="아이사랑 꿈터 1호">아이사랑 꿈터 1호</option>
    </select>
  </div>

  <div id="reader"></div>
  <div id="result" class="result"></div>
  <button id="retryBtn" class="retry-btn" style="display:none" onclick="restartScan()">다시 스캔하기</button>

<script>
// ── 설정: 실제 배포 시 이 URL을 Apps Script 웹앱 URL로 교체하세요 ──
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhq1ldVT8vYyI1XMZIryMmEYG865PgyFl6_AYFkUyY5PIo3zeN4XNjDc4F_8EkoQCMpw/exec";

// ── 참가자 명단 (구글시트 참가자명단 탭과 동일하게 유지) ──
const PARTICIPANTS = {
  "P010": { name: "정인지", zone: "금호어울림 2차 경로당" },
  "P011": { name: "김영남", zone: "금호어울림 2차 경로당" },
  "P012": { name: "이영숙", zone: "아이사랑 꿈터 1호" },
  "P013": { name: "김미선", zone: "아이사랑 꿈터 1호" },
};

// ── 출근/퇴근 판정 시간 기준 (필요에 맞게 수정) ──
const CHECKIN_START = 6;   // 오전 6시부터
const CHECKIN_END   = 10;  // 오전 10시까지 → 출근
const CHECKOUT_START = 15; // 오후 3시부터
const CHECKOUT_END   = 19; // 오후 7시까지 → 퇴근

// ── GPS 위치 검증: 구역별 고정 좌표 + 허용 반경(m) ──
const ZONE_COORDS = {
  "금호어울림 2차 경로당": { lat: 37.4947, lon: 126.4952, radius: 30000000000 },
  "아이사랑 꿈터 1호":     { lat: 37.4912, lon: 126.4862, radius: 15000000000 },
};

// 두 좌표 사이 거리(m) 계산 - 하버사인 공식
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 현재 위치를 Promise로 가져오기
function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("이 기기는 위치 확인을 지원하지 않습니다"));
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 10000,
    });
  });
}

let html5QrCode;
let isProcessing = false;

function getType() {
  const h = new Date().getHours();
  if (h >= CHECKIN_START && h < CHECKIN_END) return "출근";
  if (h >= CHECKOUT_START && h < CHECKOUT_END) return "퇴근";
  return null;
}

function showResult(cls, big, sub) {
  const el = document.getElementById("result");
  el.className = "result " + cls;
  el.innerHTML = `<span class="big">${big}</span>${sub}`;
  el.style.display = "block";
  document.getElementById("retryBtn").style.display = "inline-block";
}

async function onScanSuccess(decodedText) {
  if (isProcessing) return;
  isProcessing = true;
  html5QrCode.pause(true);

  const p = PARTICIPANTS[decodedText];
  if (!p) {
    showResult("warn", "등록되지 않은 QR", "관리자에게 문의해주세요");
    return;
  }

  const zoneFilter = document.getElementById("zoneFilter").value;
  if (zoneFilter !== "all" && p.zone !== zoneFilter) {
    showResult("warn", "구역 불일치", `${p.name}님은 ${p.zone} 소속입니다`);
    return;
  }

  const type = getType();
  if (!type) {
    showResult("warn", "체크 시간 아님", "출퇴근 인정 시간이 아닙니다");
    return;
  }

  // ── GPS 위치 검증 ──
  showResult("ok", "위치 확인 중...", "잠시만 기다려주세요");
  let coords;
  try {
    const pos = await getCurrentPosition();
    coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
  } catch (err) {
    showResult("warn", "위치 확인 실패", "위치 권한을 허용해주세요");
    return;
  }

  const zoneCoord = ZONE_COORDS[p.zone];
  const dist = getDistance(coords.lat, coords.lon, zoneCoord.lat, zoneCoord.lon);
  if (dist > zoneCoord.radius) {
    showResult("warn", "구역 밖입니다", `${p.zone}에서 ${Math.round(dist)}m 떨어진 위치입니다`);
    return;
  }

  const now = new Date();
  const payload = {
    id: decodedText,
    name: p.name,
    zone: p.zone,
    type: type,
    time: now.toISOString(),
    lat: coords.lat,
    lon: coords.lon,
  };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script 웹앱 특성상 no-cors로 전송
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    showResult("ok", `${p.name}님 ${type} 처리`, `${p.zone} · ${now.toLocaleTimeString("ko-KR")}`);
  } catch (err) {
    showResult("warn", "전송 실패", "인터넷 연결을 확인해주세요");
  }
}

function restartScan() {
  document.getElementById("result").style.display = "none";
  document.getElementById("retryBtn").style.display = "none";
  isProcessing = false;
  html5QrCode.resume();
}

window.addEventListener("load", () => {
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );
});
</script>
</body>
</html>
