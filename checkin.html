<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 체크인</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", sans-serif;
    margin: 0; padding: 16px;
    background: #f4f6f9;
    text-align: center;
  }
  h1 { font-size: 22px; color: #1B3A6B; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 16px; }
  #reader {
    width: 100%; max-width: 420px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #1B3A6B;
  }
  .result {
    max-width: 420px; margin: 20px auto;
    padding: 24px; border-radius: 12px;
    font-size: 20px; font-weight: bold;
    display: none;
  }
  .result.ok { background: #E8F5E9; color: #2E7D32; border: 2px solid #2E7D32; }
  .result.warn { background: #FBEAEA; color: #C0392B; border: 2px solid #C0392B; }
  .result .big { font-size: 28px; display: block; margin-bottom: 8px; }
  .zone-select {
    margin: 12px auto; max-width: 420px;
  }
  .zone-select select {
    font-size: 16px; padding: 8px 12px; border-radius: 8px;
  }
  .retry-btn {
    margin-top: 16px; padding: 12px 24px; font-size: 16px;
    border-radius: 8px; border: none; background: #1B3A6B; color: white; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>출퇴근 QR 체크인</h1>
  <div class="sub">배지의 QR코드를 카메라에 비춰주세요</div>

  <div class="zone-select">
    구역:
    <select id="zoneFilter">
      <option value="all">전체</option>
      <option value="금호어울림 2차 경로당">금호어울림 2차 경로당</option>
      <option value="아이사랑 꿈터 1호">아이사랑 꿈터 1호</option>
    </select>
  </div>

  <div id="reader"></div>
  <div id="result" class="result"></div>
  <button id="retryBtn" class="retry-btn" style="display:none" onclick="restartScan()">다시 스캔하기</button>

<script>
// ── 설정: 배포된 Google Apps Script 웹 앱 URL ──
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhik5C9VhIL5HOscV9LideqmZZD6E4zOED57KRq0-1NxxjYeZWfHG2oup-JN-cnVAplg/exec";

// ── 참가자 명단 (실제 운영 사업단 2곳) ──
const PARTICIPANTS = {
  // 금호어울림 2차 경로당 (10:00 ~ 13:00)
  "P010": { name: "정인지", zone: "금호어울림 2차 경로당" },
  "P011": { name: "김영남", zone: "금호어울림 2차 경로당" },

  // 아이사랑 꿈터 1호 (09:30 ~ 12:30)
  "P012": { name: "이명국", zone: "아이사랑 꿈터 1호" },
  "P013": { name: "김미선", zone: "아이사랑 꿈터 1호" },
};

// ── 두 사업장 통합 출퇴근 판정 함수 ──
function getType() {
  const h = new Date().getHours();
  const m = new Date().getMinutes();
  const totalMinutes = h * 60 + m; // 하루 중 경과된 분(Minute) 수 계산

  // 출근 인정 범위: 08:30 ~ 10:59 (510분 ~ 659분)
  // (09:30 출근조, 10:00 출근조 모두 포함)
  if (totalMinutes >= 510 && totalMinutes < 660) return "출근";

  // 퇴근 인정 범위: 11:30 ~ 13:59 (690분 ~ 839분)
  // (12:30 퇴근조, 13:00 퇴근조 모두 포함)
  if (totalMinutes >= 690 && totalMinutes < 840) return "퇴근";

  return null; // 그 외 시간대는 체크인 제한
}

function showResult(cls, big, sub) {
  const el = document.getElementById("result");
  el.className = "result " + cls;
  el.innerHTML = `<span class="big">${big}</span>${sub}`;
  el.style.display = "block";
  document.getElementById("retryBtn").style.display = "inline-block";
}

async function onScanSuccess(decodedText) {
  if (isProcessing) return;
  isProcessing = true;
  html5QrCode.pause(true);

  const p = PARTICIPANTS[decodedText];
  if (!p) {
    showResult("warn", "등록되지 않은 QR", "관리자에게 문의해주세요");
    return;
  }

  const zoneFilter = document.getElementById("zoneFilter").value;
  if (zoneFilter !== "all" && p.zone !== zoneFilter) {
    showResult("warn", "구역 불일치", `${p.name}님은 ${p.zone} 소속입니다`);
    return;
  }

  const type = getType();
  if (!type) {
    showResult("warn", "체크 시간 아님", "출퇴근 인정 시간이 아닙니다");
    return;
  }

  const now = new Date();
  const payload = {
    id: decodedText,
    name: p.name,
    zone: p.zone,
    type: type,
    time: now.toISOString(),
  };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    showResult("ok", `${p.name}님 ${type} 처리`, `${p.zone} · ${now.toLocaleTimeString("ko-KR")}`);
  } catch (err) {
    showResult("warn", "전송 실패", "인터넷 연결을 확인해주세요");
  }
}

function restartScan() {
  document.getElementById("result").style.display = "none";
  document.getElementById("retryBtn").style.display = "none";
  isProcessing = false;
  html5QrCode.resume();
}

window.addEventListener("load", () => {
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );
});
</script>
</body>
</html>
